<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>مكتب وزارة التربية والتعليم - ساحل حضرموت</title>
  <meta name="description" content="لوحة عرض رقمية لإدارة التعليم بساحل حضرموت — تعرض الأخبار والفعاليات والإحصائيات">
  <meta name="theme-color" content="#C8A84B">

  <!--
    خط Cairo: يُحمَّل من Google Fonts كاستراتيجية ثانوية.
    البيانات الأساسية تعمل بخط النظام العربي (Arial, sans-serif) إذا فشل التحميل.
    لا يُوقف الخط تحميل الصفحة بسبب display=swap.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
    media="print"
    id="cairo-font-link"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    >
  </noscript>

  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!--
    =====================================================================
    LAYOUT ROOT — تحكم نمط الليل يُطبَّق هنا عبر opacity
    =====================================================================
  -->
  <div id="app-root">

    <!-- ═══════════════════════════════════════════════════════════════
         HEADER
    ════════════════════════════════════════════════════════════════ -->
    <header id="header-bar" role="banner">
      <!-- خط زخرفي علوي -->
      <div class="header-top-line" aria-hidden="true"></div>
      <!-- توهج داخلي خفيف -->
      <div class="header-inner-glow" aria-hidden="true"></div>

      <div class="header-grid">

        <!-- عمود الشعار والعنوان (يمين في RTL) -->
        <div class="header-brand">
          <img
            src="assets/images/logo.png"
            alt="شعار وزارة التربية والتعليم"
            class="header-logo"
            id="ministry-logo"
            width="90"
            height="90"
          >
          <div class="header-title-group">
            <div class="header-title-main">مكتب وزارة التربية والتعليم</div>
            <div class="header-title-sub">ساحل حضرموت</div>
          </div>
        </div>

        <!-- العد التنازلي (وسط) -->
        <div class="header-countdown-wrapper" aria-live="polite" aria-label="العد التنازلي">
          <div id="countdown-container">
            <!-- يُملأ بـ JavaScript -->
          </div>
        </div>

        <!-- الساعة والتاريخ (يسار في RTL) -->
        <div class="header-clock-wrapper" aria-live="polite" aria-label="الوقت والتاريخ">
          <div id="clock-time" class="clock-time">--:--:--</div>
          <div id="clock-gregorian" class="clock-gregorian">--</div>
          <div id="clock-hijri" class="clock-hijri"></div>
        </div>

      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
         زر ملء الشاشة
    ════════════════════════════════════════════════════════════════ -->
    <button
      id="fullscreen-btn"
      class="fullscreen-btn"
      title="ملء الشاشة"
      aria-label="تبديل ملء الشاشة"
    >
      <svg id="fs-icon-enter" class="fs-icon" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <svg id="fs-icon-exit" class="fs-icon fs-icon-hidden" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
        <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
        <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
        <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
      </svg>
    </button>

    <!-- ═══════════════════════════════════════════════════════════════
         MAIN CONTENT (الشريحة + الشريط الجانبي)
    ════════════════════════════════════════════════════════════════ -->
    <main id="main-content" role="main">

      <!-- ≡ شريحة الأخبار/الوسائط (يُشغَّل بـ JS) ≡ -->
      <section id="news-slider-section" aria-label="شريحة الأخبار">
        <div id="news-slider" class="news-slider">

          <!-- شريط التقدم -->
          <div class="slider-progress-bar" id="slider-progress-bar" aria-hidden="true">
            <div class="slider-progress-fill" id="slider-progress-fill"></div>
          </div>

          <!-- منطقة العرض -->
          <div id="slider-content" class="slider-content">
            <!-- يُملأ بـ JavaScript -->
            <div class="slider-loading-state" id="slider-loading">
              <img src="assets/images/logo.png" alt="جاري التحميل" class="slider-loading-logo">
            </div>
          </div>

          <!-- شارة نوع المحتوى -->
          <div class="slider-badge-area" id="slider-badge-area" aria-live="polite">
            <!-- يُملأ بـ JavaScript -->
          </div>

          <!-- شارة عاجل -->
          <div class="urgent-badge" id="urgent-badge" style="display:none" role="alert">
            <span class="urgent-dot"></span>
            <span class="urgent-text">عـاجل</span>
          </div>

          <!-- خلفية iframe الفيديو — يُملأ بـ JS -->
          <div id="video-overlay-loading" class="video-overlay-loading" style="display:none" aria-hidden="true">
            <svg class="video-play-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>

        </div>
      </section>

      <!-- ≡ الشريط الجانبي ≡ -->
      <aside id="sidebar" aria-label="الفعاليات والإحصائيات">

        <!-- قسم الفعاليات -->
        <div id="events-section" class="sidebar-card">
          <div class="sidebar-section-header">
            <span class="sidebar-section-title">الفعاليات والمسابقات القادمة</span>
            <span class="sidebar-section-icon sidebar-icon-gold" aria-hidden="true">
              <!-- أيقونة تقويم -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
          </div>
          <div id="events-list" class="events-list">
            <!-- يُملأ بـ JavaScript -->
          </div>
        </div>

        <!-- قسم الإحصائيات -->
        <div id="stats-section" class="sidebar-card">
          <div class="sidebar-section-header">
            <span class="sidebar-section-title">إحصائيات الإنجاز</span>
            <span class="sidebar-section-icon sidebar-icon-red" aria-hidden="true">
              <!-- أيقونة رسم بياني -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
            </span>
          </div>
          <div id="stats-grid" class="stats-grid">
            <!-- يُملأ بـ JavaScript -->
          </div>
        </div>

      </aside>

    </main>

    <!-- ═══════════════════════════════════════════════════════════════
         FOOTER TICKER
    ════════════════════════════════════════════════════════════════ -->
    <footer id="ticker-bar" role="contentinfo" aria-label="إعلانات">
      <div class="ticker-label" aria-hidden="true">
        <!-- أيقونة مكبر الصوت — SVG مباشر لتجنب أي تبعية -->
        <svg class="ticker-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M3 11v2"/>
          <path d="M8 7v10"/>
          <path d="M13 5v14"/>
          <path d="M18 3v18"/>
          <path d="M21 6l-3-3"/>
          <path d="M21 18l-3 3"/>
        </svg>
        <span class="ticker-label-text">إعـلان</span>
      </div>
      <div class="ticker-track" aria-hidden="true">
        <div id="ticker-content" class="ticker-content">
          <!-- يُملأ بـ JavaScript -->
        </div>
      </div>
    </footer>

  </div><!-- /#app-root -->

  <script src="script.js"></script>

  <!--
    Cairo font swap: يتم تحميل الخط بعد تحميل الصفحة لتجنب الحجب
    هذا يضمن عرض المحتوى العربي فوراً مع خط النظام ثم التبديل لـ Cairo
  -->
  <script>
    (function() {
      try {
        var link = document.getElementById('cairo-font-link');
        if (link) {
          link.addEventListener('load', function() {
            link.media = 'all';
          });
          // fallback إذا كان الحدث قد حدث بالفعل
          if (link.sheet) link.media = 'all';
        }
      } catch(e) { /* تجاهل أي خطأ في تحميل الخط */ }
    })();
  </script>

</body>
</html>
